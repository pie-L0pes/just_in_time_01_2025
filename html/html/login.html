<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDF - Login</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>

    <main>
        <section class="login">
            <h1>Controle MDF</h1>
            <h2>Login</h2>

            <form id="formLogin">
                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required
                >

                <button type="submit">Entrar</button>

                <p id="mensagem"></p>
            </form>
        </section>
    </main>

    <script src="../js/login.js"></script>

</body>
</html>
