<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDF - Produtos</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>

    <header>
        <h1>Produtos</h1>

        <div class="usuario">
            <span id="nomeUsuario">Usuário</span>
            <button id="btnSair">Sair</button>
        </div>
    </header>

    <main>
        <div class="topo-pagina">
            <div>
                <h2>Produtos cadastrados</h2>
                <p>Gerencie os produtos do estoque.</p>
            </div>

            <a href="index.html" class="voltar">Voltar</a>
        </div>

        <div class="acoes">
            <input type="text" id="pesquisa" placeholder="Pesquisar produto...">
            <button id="btnNovo">+ Novo produto</button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Custo</th>
                        <th>Estoque</th>
                        <th>Estoque mínimo</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>
            </table>
        </div>

        <p id="mensagem"></p>
    </main>

    <div class="modal" id="modal">
        <div class="modal-conteudo">
            <h2 id="tituloModal">Novo produto</h2>

            <form id="formProduto">
                <input type="hidden" id="produtoId">

                <input type="text" id="nome" placeholder="Nome" required>

                <textarea id="descricao" placeholder="Descrição" required></textarea>

                <input
                    type="number"
                    id="custo"
                    placeholder="Custo"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="estoque"
                    placeholder="Estoque"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="estoqueMinimo"
                    placeholder="Estoque mínimo"
                    min="0"
                    required
                >

                <div class="botoes-modal">
                    <button type="button" id="btnCancelar">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/produtos.js"></script>

</body>
</html>
